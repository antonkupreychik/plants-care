services:
  postgres:
    image: postgres:16-alpine
    container_name: plants-care-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plants_care}
      POSTGRES_USER: ${POSTGRES_USER:-plants_care}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plants_care}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plants_care} -d ${POSTGRES_DB:-plants_care}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Сервис app запускается только с профилем "full":
    #   docker compose --profile full up -d
    # Для локальной разработки без контейнера приложения:
    #   docker compose up -d  (поднимет только postgres)
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plants-care-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-plants_care}
      DB_USERNAME: ${POSTGRES_USER:-plants_care}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-plants_care}
      SERVER_PORT: 8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
    ports:
      - "${APP_PORT:-8080}:8080"

  redis:
    # Issue #278, эпик #277 фаза 0: Redis для локальной разработки.
    # Запускать через профиль "redis":
    #   docker compose --profile redis up -d
    # или вместе с Postgres:
    #   docker compose --profile redis up -d postgres redis
    # На Railway Redis поднят отдельным сервисом; здесь — только для dev/локалки.
    profiles: ["redis"]
    image: redis:7-alpine
    container_name: plants-care-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    # Локальный Prometheus, скрейпит /actuator/prometheus приложения.
    # Запускать через профиль monitoring:
    #   docker compose --profile monitoring up -d
    # Если app запущена в контейнере одновременно:
    #   docker compose --profile full --profile monitoring up -d
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    container_name: plants-care-prometheus
    restart: unless-stopped
    extra_hosts:
      # На Linux позволяет резолвить host.docker.internal в IP хоста.
      # На macOS / Windows host.docker.internal работает без этой опции.
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    # Локальная Grafana с автопровиженным дашбордом из grafana/.
    # Запускать через профиль monitoring:
    #   docker compose --profile monitoring up -d
    # Открыть: http://localhost:3000
    # Anonymous auth включён, логин не нужен; роль — Admin (только для dev).
    profiles: ["monitoring"]
    image: grafana/grafana:11.2.2
    container_name: plants-care-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/plants-care-dashboard.json"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

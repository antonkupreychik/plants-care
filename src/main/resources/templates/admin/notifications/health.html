<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/_layout}"
      lang="ru">
<head>
    <title>Каналы уведомлений</title>
</head>
<body>
<section layout:fragment="content">

    <div class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-bold">Каналы уведомлений</h1>
        <span class="text-xs text-base-content/60">
            issue #95 · TELEGRAM + PUSH (push = FCM, он же APNs для iOS, ADR-016)
        </span>
    </div>

    <!-- Фильтры: окно и канал. Обычная GET-форма — состояние живёт в URL. -->
    <form method="get" th:action="@{/admin/notifications/health}"
          class="flex flex-wrap items-end gap-3 mb-4">
        <label class="form-control">
            <span class="label-text text-xs">Окно, часов</span>
            <select name="hours" class="select select-bordered select-sm" onchange="this.form.submit()">
                <option value="1" th:selected="${health.hours == 1}">1</option>
                <option value="6" th:selected="${health.hours == 6}">6</option>
                <option value="24" th:selected="${health.hours == 24}">24</option>
                <option value="72" th:selected="${health.hours == 72}">72</option>
                <option value="168" th:selected="${health.hours == 168}">168</option>
            </select>
        </label>
        <label class="form-control">
            <span class="label-text text-xs">Канал (ошибки и юзеры)</span>
            <select name="channel" class="select select-bordered select-sm" onchange="this.form.submit()">
                <option value="all" th:selected="${health.channelFilter == 'all'}">Все</option>
                <option value="TELEGRAM" th:selected="${health.channelFilter == 'TELEGRAM'}">TELEGRAM</option>
                <option value="PUSH" th:selected="${health.channelFilter == 'PUSH'}">PUSH</option>
            </select>
        </label>
        <button type="submit" class="btn btn-sm">Применить</button>
    </form>

    <!-- Chart.js с того же CDN, что и DaisyUI в layout -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!--
      HTMX-поллинг: раз в минуту тянем тот же фрагмент и подменяем содержимое.
      Параметры фильтров прокидываем в hx-get, чтобы автообновление не сбрасывало
      выбранное окно/канал.
    -->
    <div id="health-body"
         th:attr="hx-get=@{/admin/notifications/health/_fragment(hours=${health.hours},channel=${health.channelFilter})}"
         hx-trigger="every 60s"
         hx-swap="innerHTML">
        <div th:replace="~{admin/notifications/_health-body :: body}"></div>
    </div>

    <script>
        (function () {
            let chart = null;

            function renderChart() {
                const dataNode = document.getElementById('channel-chart-data');
                const canvas = document.getElementById('channel-chart');
                if (chart) {
                    // Каждый HTMX-своп приносит новый <canvas>; старый инстанс Chart.js
                    // держит ссылку на выброшенный узел — обязательно уничтожаем.
                    chart.destroy();
                    chart = null;
                }
                if (!dataNode || !canvas || typeof Chart === 'undefined') return;

                let payload;
                try {
                    payload = JSON.parse(dataNode.textContent);
                } catch (e) {
                    return;
                }
                const palette = ['#3b82f6', '#f59e0b', '#10b981', '#ef4444'];
                chart = new Chart(canvas, {
                    type: 'line',
                    data: {
                        labels: payload.labels || [],
                        datasets: (payload.series || []).map((s, i) => ({
                            label: s.channel,
                            data: s.counts || [],
                            borderColor: palette[i % palette.length],
                            backgroundColor: palette[i % palette.length],
                            tension: 0.25
                        }))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', renderChart);
            document.body.addEventListener('htmx:afterSwap', function (event) {
                if (event.target && event.target.id === 'health-body') renderChart();
            });
        })();
    </script>

</section>
</body>
</html>

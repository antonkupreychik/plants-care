# Общие параметры (path-id), переиспользуемые между ресурсами.
# Идентификация пользователя теперь через JWT bearer-токен (issue #88), а не
# через заголовки — отдельных параметров для неё нет.

PlantIdPath:
  name: id
  in: path
  required: true
  description: Идентификатор растения.
  schema:
    type: integer
    format: int64
    example: 1

LocationIdPath:
  name: id
  in: path
  required: true
  description: Идентификатор локации.
  schema:
    type: integer
    format: int64
    example: 1

RoomIdPath:
  name: id
  in: path
  required: true
  description: Идентификатор комнаты.
  schema:
    type: integer
    format: int64
    example: 1

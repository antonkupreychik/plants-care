# Общие 4xx ответы REST API. Все ссылаются на ApiErrorResponse в errors.yaml.

BadRequest:
  description: |
    Невалидный запрос. Возвращается при провале Bean Validation
    (`VALIDATION_ERROR` + `details` по полям) или при неприемлемых
    параметрах (`BAD_REQUEST`).
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      examples:
        validation:
          summary: Ошибка валидации поля
          value:
            error:
              code: VALIDATION_ERROR
              message: Validation failed
              details:
                - field: name
                  message: must not be blank
        badRequest:
          summary: Невалидный аргумент
          value:
            error:
              code: BAD_REQUEST
              message: limit must be between 1 and 100

Unauthorized:
  description: |
    Аутентификация не пройдена. Возвращается при отсутствии/невалидности
    bearer-токена или при проблеме с auth-токеном (Apple/Google/magic-link/
    refresh). Коды: `TOKEN_EXPIRED`, `TOKEN_INVALID`, `TOKEN_REVOKED`.
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: TOKEN_INVALID
          message: Token is invalid

TooManyRequests:
  description: Превышен лимит запросов (rate limit).
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: RATE_LIMITED
          message: Too many requests

Forbidden:
  description: Ресурс существует, но принадлежит другому пользователю.
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: ACCESS_DENIED
          message: Access denied

NotFound:
  description: Ресурс не найден или архивирован.
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: NOT_FOUND
          message: Resource not found

Conflict:
  description: Конфликт состояния — например, попытка нарушить инвариант домена.
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: CONFLICT
          message: Operation not allowed in the current state

UnprocessableEntity:
  description: |
    Тело запроса синтаксически корректно, но семантически невалидно — например,
    значение enum вне допустимого набора. Код `VALIDATION_ERROR`.
  content:
    application/json:
      schema:
        $ref: './errors.yaml#/schemas/ApiErrorResponse'
      example:
        error:
          code: VALIDATION_ERROR
          message: Validation failed

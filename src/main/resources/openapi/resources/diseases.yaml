# Публичный справочник болезней и вредителей. Без авторизации.

paths:
  Collection:
    get:
      tags: [Diseases]
      operationId: listDiseases
      summary: Список болезней / полнотекстовый поиск
      description: |
        Публичный справочник болезней и вредителей комнатных растений.
        Без авторизации.

        Без параметра `q` — полный список в алфавитном порядке постранично.
        С параметром `q` — полнотекстовый поиск (GIN-индекс `idx_diseases_search`).

        `limit` обрезается до 100.
      parameters:
        - name: q
          in: query
          required: false
          description: Поисковая строка. Если пустая — возвращаются все болезни.
          schema:
            type: string
            default: ""
            example: клещ
        - name: offset
          in: query
          required: false
          description: Сдвиг от начала.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Размер страницы. Обрезается до 100.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Страница болезней.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PageResponseDiseaseDto'

  Item:
    get:
      tags: [Diseases]
      operationId: getDiseaseById
      summary: Карточка болезни по id
      description: Полная карточка болезни/вредителя. 404 если не найдена.
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор болезни.
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: Болезнь найдена.
          content:
            application/json:
              schema:
                $ref: '#/schemas/DiseaseDto'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

schemas:
  DiseaseDto:
    type: object
    description: Карточка болезни/вредителя комнатных растений.
    required: [id, name, symptoms, treatment, prevention]
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        example: Паутинный клещ
      latinName:
        type: string
        nullable: true
        example: Tetranychus urticae
      symptoms:
        type: string
        example: Мелкая белёсая крапчатость на листьях…
      treatment:
        type: string
        example: Промыть тёплым душем, обработать акарицидом…
      prevention:
        type: string
        example: Поддерживать влажность воздуха…

  PageResponseDiseaseDto:
    type: object
    description: Постраничный ответ со списком болезней/вредителей.
    required: [items, total, offset, limit]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiseaseDto'
      total:
        type: integer
        format: int64
        description: Общее количество болезней (с учётом фильтра `q`).
      offset:
        type: integer
        format: int32
      limit:
        type: integer
        format: int32

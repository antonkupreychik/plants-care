# CRUD локаций пользователя + activate / pause / resume (issue #250).

paths:
  Collection:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: Список локаций пользователя
      description: |
        Возвращает все незаархивированные локации, принадлежащие текущему пользователю
        (`sub` из bearer-токена). Без пагинации — у пользователя обычно
        меньше десятка локаций.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список локаций.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/schemas/LocationDto'
    post:
      tags: [Locations]
      operationId: createLocation
      summary: Создать локацию
      description: |
        Создаёт локацию от имени пользователя. Имя уникально в рамках
        пользователя — при коллизии возвращается 400 с `code=BAD_REQUEST`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/LocationCreateRequest'
            example:
              name: Подоконник
              emoji: "🪟"
      responses:
        '201':
          description: Локация создана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'

  Item:
    get:
      tags: [Locations]
      operationId: getLocation
      summary: Получить локацию по ID
      description: |
        Возвращает локацию, если она принадлежит пользователю. Чужие или
        несуществующие локации — 404 (различения не делаем, чтобы не
        раскрывать существование чужих ID).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      responses:
        '200':
          description: Локация найдена.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'
    patch:
      tags: [Locations]
      operationId: updateLocation
      summary: Обновить локацию
      description: PATCH-семантика — обновляются только переданные поля.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/LocationUpdateRequest'
      responses:
        '200':
          description: Локация обновлена.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'
    delete:
      tags: [Locations]
      operationId: deleteLocation
      summary: Архивировать локацию
      description: |
        Архивирует (soft-delete) локацию. Если в локации есть активные растения —
        возвращает 409 с `code=LOCATION_NOT_EMPTY`. Перенос растений перед удалением
        выполняется отдельным вызовом (`PATCH /plants/{id}` с новым `locationId`),
        каскадного переноса нет.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      responses:
        '204':
          description: Локация архивирована.
        '409':
          description: |
            В локации есть активные растения. Перенесите их перед удалением.
            `code=LOCATION_NOT_EMPTY`.
          content:
            application/json:
              schema:
                $ref: '../_common/errors.yaml#/schemas/ApiErrorResponse'
              examples:
                notEmpty:
                  summary: Локация содержит растения
                  value:
                    error:
                      code: LOCATION_NOT_EMPTY
                      message: "Локация содержит активные растения. Перенесите их перед удалением."
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemActivate:
    post:
      tags: [Locations]
      operationId: activateLocation
      summary: Сделать локацию активной
      description: |
        Устанавливает данную локацию как активную для пользователя
        (`users.active_location_id`). Предыдущая активная локация теряет флаг `isActive`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      responses:
        '200':
          description: Локация стала активной.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemPause:
    post:
      tags: [Locations]
      operationId: pauseLocation
      summary: Поставить локацию на паузу
      description: |
        Ставит локацию на паузу на указанное количество дней (1–180).
        На время паузы растения этой локации исключаются из шедулера уведомлений
        и из «сегодняшних дел». Глобальная пауза пользователя (`users.paused_until`)
        имеет приоритет.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/LocationPauseRequest'
            example:
              days: 7
      responses:
        '200':
          description: Локация на паузе.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemResume:
    post:
      tags: [Locations]
      operationId: resumeLocation
      summary: Снять паузу с локации
      description: |
        Снимает паузу (`paused_until = null`). После этого растения локации
        снова попадают в шедулер и «сегодняшние дела».
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/LocationIdPath'
      responses:
        '200':
          description: Пауза снята.
          content:
            application/json:
              schema:
                $ref: '#/schemas/LocationDto'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

schemas:
  LocationDto:
    type: object
    description: Локация (комната/место), в которой пользователь держит растения.
    required: [id, name, defaultLocation, isActive]
    properties:
      id:
        type: integer
        format: int64
      name:
        type: string
        example: Подоконник
      emoji:
        type: string
        nullable: true
        example: "🪟"
      defaultLocation:
        type: boolean
        description: Является ли локация дефолтной для пользователя.
        example: false
      isActive:
        type: boolean
        description: |
          Является ли локация текущей активной локацией пользователя
          (`users.active_location_id`).
        example: false
      pausedUntil:
        type: string
        format: date-time
        nullable: true
        description: |
          Если задано — уведомления и задачи по растениям этой локации
          приостановлены до указанного момента (UTC).
      createdAt:
        type: string
        format: date-time
        nullable: true

  LocationCreateRequest:
    type: object
    required: [name]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 30
        example: Подоконник
      emoji:
        type: string
        maxLength: 16
        nullable: true
        example: "🌿"

  LocationUpdateRequest:
    type: object
    description: Все поля опциональны.
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 30
        nullable: true
      emoji:
        type: string
        maxLength: 16
        nullable: true

  LocationPauseRequest:
    type: object
    required: [days]
    description: Запрос на паузу локации.
    properties:
      days:
        type: integer
        minimum: 1
        maximum: 180
        description: Количество дней паузы (1–180).
        example: 7

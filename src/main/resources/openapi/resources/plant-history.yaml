# История ухода за растением. Использует CareEventResponse из care-events.yaml.

paths:
  ItemHistory:
    get:
      tags: [Plant History]
      operationId: getPlantHistory
      summary: История событий ухода за растением
      description: |
        Возвращает страницу истории ухода за растением, принадлежащим
        текущему пользователю (`sub` из bearer-токена).

        В выдачу попадают только активные (не отменённые) записи всех типов
        ухода **кроме `SOIL_CHECK`** — это служебный тип, который наружу не
        выставляется.

        Пагинация — `limit/offset`. `limit` строго в диапазоне [1, 100]
        (значения вне диапазона отдаются как 400). `offset` < 0 нормализуется
        в 0.

        Опциональный параметр `type` позволяет фильтровать историю по типу
        ухода. Допустимые значения: `WATER`, `SPRAY`, `FERTILIZE`.
        Если не задан — возвращаются все типы.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
        - name: limit
          in: query
          required: false
          description: Размер страницы. Допустимые значения — [1, 100].
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Сдвиг от начала истории. Значения < 0 нормализуются в 0.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
        - name: type
          in: query
          required: false
          description: |
            Фильтр по типу ухода. Допустимые значения: `WATER`, `SPRAY`, `FERTILIZE`.
            Если не задан — возвращаются все типы.
          schema:
            $ref: './care-events.yaml#/schemas/CareEventType'
      responses:
        '200':
          description: Страница истории.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantHistoryResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemHistorySummary:
    get:
      tags: [Plant History]
      operationId: getPlantHistorySummary
      summary: Сводная статистика по всей истории растения
      description: |
        Возвращает агрегированную статистику по **всей** истории ухода за
        растением (не по странице). Учитываются только активные (не отменённые)
        записи. Тип `SOIL_CHECK` из выдачи исключён.

        Доступ только к неархивированному растению текущего пользователя
        (`sub` из bearer-токена). Если растение не найдено или принадлежит
        другому пользователю — 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '200':
          description: Сводная статистика посчитана.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantHistorySummaryDto'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

schemas:
  PlantHistoryResponse:
    type: object
    description: Страница истории ухода за растением с метаданными пагинации.
    required: [items, total, limit, offset]
    properties:
      items:
        type: array
        items:
          $ref: './care-events.yaml#/schemas/CareEventResponse'
      total:
        type: integer
        format: int64
        description: Общее количество активных записей.
        example: 17
      limit:
        type: integer
        format: int32
        example: 20
      offset:
        type: integer
        format: int32
        example: 0

  PlantHistorySummaryDto:
    type: object
    description: Агрегированная статистика по всей истории ухода за растением.
    required: [total, onTimeCount, onTimePercent, byType]
    properties:
      total:
        type: integer
        format: int64
        description: Всего активных (не отменённых) записей истории.
        example: 47
      onTimeCount:
        type: integer
        format: int64
        description: Из них выполненных вовремя (`was_on_time = true`).
        example: 38
      onTimePercent:
        type: integer
        format: int32
        description: Процент вовремя выполненных. 0 если `total = 0`.
        example: 81
      byType:
        type: object
        description: |
          Разбивка по типам ухода. Только типы с `count > 0`, `SOIL_CHECK` исключён.
          Ключи — значения `CareEventType` (`WATER`, `SPRAY`, `FERTILIZE`).
        additionalProperties:
          type: integer
          format: int64
        example:
          WATER: 20
          SPRAY: 15
          FERTILIZE: 12

# Задачи ухода на сегодня в TZ пользователя. Использует TaskDto из calendar.yaml.

paths:
  Collection:
    get:
      tags: [Today]
      operationId: getToday
      summary: Задачи на сегодня
      description: |
        Возвращает задачи ухода, дедлайн которых наступает до конца
        сегодняшнего дня в **таймзоне пользователя** (`users.timezone`).

        Учитываются только активные расписания; завершённые или приостановленные
        не попадают в выдачу.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список задач на сегодня.
          content:
            application/json:
              schema:
                $ref: '#/schemas/TodayResponse'

schemas:
  TodayResponse:
    type: object
    description: Ответ `GET /api/v1/today`.
    required: [tasks, count, summary]
    properties:
      tasks:
        type: array
        items:
          $ref: './calendar.yaml#/schemas/TaskDto'
      count:
        type: integer
        format: int32
        description: Длина `tasks` (дублируется для удобства клиента).
      summary:
        $ref: '#/schemas/TodaySummary'

  TodaySummary:
    type: object
    description: |
      Сводка по сегодняшним задачам (mobile gap G11, ADR-014).
      `total == count ==` длине `tasks`. `done + remaining == total`.
    required: [total, done, remaining, overdue]
    properties:
      total:
        type: integer
        format: int32
        description: Всего задач в выдаче (= `count`).
      done:
        type: integer
        format: int32
        description: Задачи, отмеченные сегодня (`doneAt != null`).
      remaining:
        type: integer
        format: int32
        description: Невыполненные задачи (`total - done`).
      overdue:
        type: integer
        format: int32
        description: Невыполненные задачи, дедлайн которых уже прошёл (`nextDueAt < now`).

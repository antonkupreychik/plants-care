# CRUD растений. Soft-delete через archivedAt.

paths:
  Collection:
    get:
      tags: [ Plants ]
      operationId: listPlants
      summary: Список растений пользователя
      description: |
        Возвращает страницу растений, принадлежащих текущему пользователю
        (`sub` из bearer-токена). Архивированные (soft-deleted) растения в
        выдачу не попадают.

        Можно фильтровать по локации параметром `locationId`. Пагинация —
        классическая `offset/limit`.

        Параметры приводятся к безопасным границам:
        * `limit` обрезается до диапазона **[1, 100]** (всё, что больше 100,
          становится 100; всё, что меньше 1 — становится 1);
        * `offset` ниже нуля становится 0.
      security:
        - bearerAuth: [ ]
      parameters:
        - name: locationId
          in: query
          required: false
          description: Идентификатор локации. Если задан, возвращаются только растения из неё.
          schema:
            type: integer
            format: int64
            example: 2
        - name: offset
          in: query
          required: false
          description: Сдвиг от начала выборки. Значения < 0 трактуются как 0.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
            example: 0
        - name: limit
          in: query
          required: false
          description: Размер страницы. Обрезается до [1, 100] на сервере.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
            example: 20
      responses:
        '200':
          description: Страница растений.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PageResponsePlantDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'

    post:
      tags: [ Plants ]
      operationId: createPlant
      summary: Создать растение
      description: |
        Создаёт растение от имени текущего пользователя (`sub` из
        bearer-токена). Если `locationId` не указан, растение попадает в
        дефолтную локацию пользователя. Если `parentPlantId` указан, растение
        создаётся как отводок/потомок материнского растения.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/PlantCreateRequest'
            example:
              name: Monstera
              notes: Стоит у окна, любит свет
              locationId: 2
              speciesId: 5
              parentPlantId: 10
      responses:
        '201':
          description: Растение создано.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'

  Item:
    get:
      tags: [ Plants ]
      operationId: getPlant
      summary: Получить растение по ID
      description: |
        Возвращает растение, если оно принадлежит текущему пользователю
        (`sub` из bearer-токена) и не архивировано. Чужие или несуществующие
        растения отдаются как 404, чужие активные — как 403 (когда сервис уже
        знает, что запись есть, но принадлежит другому пользователю).
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '200':
          description: Растение найдено.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantDto'
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

    put:
      tags: [ Plants ]
      operationId: updatePlant
      summary: Обновить растение (PATCH-семантика)
      description: |
        Несмотря на HTTP-метод `PUT`, апдейт реализован по принципу PATCH:
        обновляются **только присутствующие в теле** поля. Передача `null`
        в поле трактуется как «не менять».

        Пример: чтобы переместить растение в другую локацию, достаточно
        отправить `{ "locationId": 5 }`.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/PlantUpdateRequest'
            example:
              name: Monstera deliciosa
              notes: Поливать раз в неделю
      responses:
        '200':
          description: Растение обновлено.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantDto'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

    delete:
      tags: [ Plants ]
      operationId: deletePlant
      summary: Архивировать растение (soft-delete)
      description: |
        Помечает растение как удалённое (`archived_at = now()` в UTC). Запись
        в БД остаётся, но перестаёт появляться во всех `/api/v1/plants/*`
        выборках. Восстановления через API в этой версии нет.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '204':
          description: Растение архивировано. Тело ответа отсутствует.
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemHealth:
    get:
      tags: [ Plants ]
      operationId: getPlantHealth
      summary: Health-score растения
      description: |
        Возвращает числовой балл здоровья растения 0–100 и цветовую зону
        (mobile gap G1, issue #138). Балл считается поверх истории ухода за
        окно 30 дней в таймзоне пользователя плюс бонусы за фото/заметки.

        Если активных записей ухода меньше порога (`< 3`), балл не
        вычисляется: `insufficientData = true`, а `score`/`zone` приходят
        `null` (клиент рисует кольцо нейтральным / «Пока мало данных»).

        Доступ только к своему неархивированному растению (как `GET /plants/{id}`).
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '200':
          description: Health-score растения.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantHealthDto'
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemFamily:
    get:
      tags: [ Plants ]
      operationId: getPlantFamily
      summary: Родословная растения
      description: |
        Возвращает материнское растение и прямых потомков/отводки
        для текущего растения. Доступ только к растениям текущего пользователя.
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '200':
          description: Родословная растения.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantFamilyResponse'
              example:
                parent:
                  id: 10
                  name: Монстера мама
                children:
                  - id: 25
                    name: Отводок 1
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

  ItemDiagnosis:
    get:
      tags: [ Plants ]
      operationId: getPlantDiagnosis
      summary: Пассивная диагностика растения
      description: |
        Возвращает список выявленных проблем (`issues`) и рекомендаций
        (`recommendations`) для растения (mobile screen 15 «Диагноз»,
        issue #193). Диагноз пассивный — выводится только из уже имеющихся
        данных (просроченные расписания ухода, health-зона), без ИИ и без
        интерактивного опросника. Новой схемы БД не требует.

        Если активных записей ухода меньше порога (`< 3`), диагноз не
        строится: `issues` пустой, в `recommendations` — единственная
        подсказка продолжать отмечать уход.

        У здорового растения (данных достаточно, нет просрочек, зона не `RED`)
        и `issues`, и `recommendations` пустые.

        Доступ только к своему неархивированному растению (как `GET /plants/{id}`).
      security:
        - bearerAuth: [ ]
      parameters:
        - $ref: '../_common/parameters.yaml#/PlantIdPath'
      responses:
        '200':
          description: Диагноз растения.
          content:
            application/json:
              schema:
                $ref: '#/schemas/PlantDiagnosisDto'
        '403':
          $ref: '../_common/responses.yaml#/Forbidden'
        '404':
          $ref: '../_common/responses.yaml#/NotFound'

schemas:
  PlantDiagnosisDto:
    type: object
    description: |
      Результат пассивной диагностики растения (mobile screen 15, issue #193).
      Форма ответа всегда `{ issues, recommendations }` — даже когда данных мало
      или растение здорово (тогда массивы пустые / содержат только подсказку).
    required: [ issues, recommendations ]
    properties:
      issues:
        type: array
        description: Выявленные проблемы, отсортированы по severity (HIGH → LOW).
        items:
          $ref: '#/schemas/DiagnosisIssueDto'
      recommendations:
        type: array
        description: |
          Рекомендации, собранные по проблемам (в том же порядке) с дедупликацией.
        items:
          type: string
        example:
          - Полей растение сегодня
          - Проверь, не пересох ли грунт

  DiagnosisIssueDto:
    type: object
    description: Отдельная выявленная проблема растения.
    required: [ code, severity, title ]
    properties:
      code:
        type: string
        description: |
          Семантический код проблемы (`UNDERWATERED`, `UNDERFED`,
          `LOW_HUMIDITY`, `SOIL_CHECK_DUE`, `NEGLECTED`, ...). Строка —
          а не enum — для forward-совместимости с новыми кодами.
        example: UNDERWATERED
      severity:
        type: string
        enum: [ HIGH, MEDIUM, LOW ]
        description: Серьёзность проблемы.
        example: HIGH
      title:
        type: string
        description: Человекочитаемый заголовок проблемы (локализован).
        example: Пересушен

  PlantHealthDto:
    type: object
    description: |
      Health-score растения (mobile gap G1). При `insufficientData = true`
      поля `score` и `zone` равны `null`.
    required: [ insufficientData ]
    properties:
      insufficientData:
        type: boolean
        description: |
          `true` — данных мало (`< 3` активных записей ухода), балл не
          вычислялся; `score`/`zone` будут `null`.
      score:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        nullable: true
        description: Балл 0–100. `null`, если `insufficientData = true`.
      zone:
        type: string
        enum: [ GREEN, YELLOW, RED ]
        nullable: true
        description: |
          Цветовая зона по порогам (`GREEN`/`YELLOW`/`RED`). `null`, если
          `insufficientData = true`.

  PlantFamilyMemberDto:
    type: object
    description: Короткое представление растения в родословной.
    required: [ id, name ]
    properties:
      id:
        type: integer
        format: int64
        example: 10
      name:
        type: string
        example: Монстера мама

  PlantFamilyResponse:
    type: object
    description: Родословная растения — родитель и прямые потомки.
    required: [ children ]
    properties:
      parent:
        $ref: '#/schemas/PlantFamilyMemberDto'
      children:
        type: array
        items:
          $ref: '#/schemas/PlantFamilyMemberDto'

  PlantDto:
    type: object
    description: |
      Растение в формате REST API. Поля `locationName` / `speciesName`
      денормализованы из связанных сущностей для удобства фронта.
    required: [ id, name, archived ]
    properties:
      id:
        type: integer
        format: int64
        description: Уникальный идентификатор растения.
        example: 1
      name:
        type: string
        description: Имя растения, заданное пользователем.
        example: Monstera
      notes:
        type: string
        nullable: true
        description: Произвольные заметки пользователя.
        example: Стоит у окна, любит свет
      photoFileId:
        type: string
        nullable: true
        description: Telegram `file_id` загруженной фотографии. Используется ботом для повторной отправки без скачивания.
      locationId:
        type: integer
        format: int64
        nullable: true
        description: Идентификатор локации, в которой стоит растение.
        example: 2
      locationName:
        type: string
        nullable: true
        description: Денормализованное имя локации на момент запроса.
        example: Подоконник
      speciesId:
        type: integer
        format: int64
        nullable: true
        description: Идентификатор вида из справочника.
        example: 5
      speciesName:
        type: string
        nullable: true
        description: Денормализованное название вида.
        example: Monstera deliciosa
      archived:
        type: boolean
        description: Признак того, что растение архивировано (soft-deleted). В выдаче списков всегда `false`.
        example: false
      createdAt:
        type: string
        format: date-time
        nullable: true
        description: Момент создания записи в БД (UTC).
        example: 2026-05-24T10:15:30Z
      healthInsufficientData:
        type: boolean
        nullable: true
        description: true — данных мало (< 3 активных записей ухода), score/zone равны null.
      healthScore:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        nullable: true
        description: Балл здоровья 0–100 (mobile gap G16). null если insufficientData.
      healthZone:
        type: string
        enum: [ GREEN, YELLOW, RED ]
        nullable: true
        description: Цветовая зона. null если insufficientData.
      acquiredAt:
        type: string
        format: date
        nullable: true
        description: Дата покупки/получения растения (ISO-8601). null если не указана.
        example: "2026-05-20"
      inAcclimation:
        type: boolean
        nullable: true
        description: true пока acclimation_until > now(). Вычисляемое поле, в БД не хранится.
        example: true
      acclimationUntil:
        type: string
        format: date-time
        nullable: true
        description: Конец периода акклиматизации (UTC). null если акклиматизация не активна.
        example: "2026-06-10T12:00:00Z"

  PlantCreateRequest:
    type: object
    description: Тело POST /api/v1/plants.
    required: [ name ]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Имя нового растения. Обязательно, не пустое.
        example: Monstera
      notes:
        type: string
        maxLength: 2000
        nullable: true
        description: Опциональные заметки пользователя.
      locationId:
        type: integer
        format: int64
        nullable: true
        description: Идентификатор локации. Если не задан, используется дефолтная локация пользователя.
      speciesId:
        type: integer
        format: int64
        nullable: true
        description: |
          Идентификатор вида растения (`Species.id`). Опционально. Если задан —
          растение связывается с видом (mobile gap G13); вид должен существовать,
          иначе `404 NOT_FOUND`. Расписания ухода при этом **не** создаются
          автоматически (отдельная задача G14).
      parentPlantId:
        type: integer
        format: int64
        nullable: true
        description: |
          ID материнского растения. Если задан, новое растение считается
          отводком/потомком этого растения. Родитель должен принадлежать текущему
          пользователю и не быть архивированным, иначе 404/403.
        example: 10
      acquiredAt:
        type: string
        format: date
        nullable: true
        description: Дата покупки/получения растения (ISO-8601). Используется для годовщин и строки «С тобой с …».
        example: "2026-05-20"
      isNew:
        type: boolean
        nullable: true
        description: Если true — включить режим акклиматизации на 21 день после создания.
        example: true
      schedules:
        type: array
        nullable: true
        description: |
          Опциональные расписания ухода. Если не передан или пуст — применяются
          дефолты вида (как при обычном создании).
        items:
          $ref: '../resources/schedules.yaml#/schemas/ScheduleInput'

  PlantUpdateRequest:
    type: object
    description: Тело PUT /api/v1/plants/{id}. Все поля опциональны.
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        nullable: true
      notes:
        type: string
        maxLength: 2000
        nullable: true
      locationId:
        type: integer
        format: int64
        nullable: true
      speciesId:
        type: integer
        format: int64
        nullable: true
        description: |
          Новый вид растения. Если не передан — вид не изменяется.
          Для снятия привязки используй clearSpecies: true.
          Если вид не найден — 404.
      clearSpecies:
        type: boolean
        nullable: true
        description: |
          true — убрать привязку к виду (plant.species = null).
          Игнорируется, если speciesId задан.

  PageResponsePlantDto:
    type: object
    description: Постраничный ответ со списком растений.
    required: [ items, total, offset, limit ]
    properties:
      items:
        type: array
        description: Растения на текущей странице.
        items:
          $ref: '#/schemas/PlantDto'
      total:
        type: integer
        format: int32
        description: Общее количество растений, удовлетворяющих фильтру.
        example: 42
      offset:
        type: integer
        format: int32
        example: 0
      limit:
        type: integer
        format: int32
        example: 20
# Профиль и настройки текущего пользователя (issue #182, mobile G5 + G16).
# Скоуп — аутентифицированный пользователь (`sub` из bearer-токена).
# `quietHours*` — локальное время в TZ юзера (HH:mm); все счётчики считаются
# в таймзоне пользователя (users.timezone).

paths:
  WeatherLocation:
    put:
      tags: [Me]
      operationId: updateWeatherLocation
      summary: Установить координаты для погодного виджета
      description: |
        Сохраняет широту и долготу пользователя (`weather_lat` / `weather_lon`),
        необходимые для получения данных о влажности через
        `GET /api/v1/weather/snapshot`.

        Без координат `weatherEnabled=true` в `PATCH /me` бесполезен — погодные
        эвристики не запустятся. После успешного вызова этого эндпоинта
        `WeatherService.isWeatherUsable()` начнёт возвращать `true` при включённом
        `weatherEnabled`.

        Ответ `204 No Content` — нет тела, обновление применено.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/WeatherLocationRequest'
            example:
              lat: 55.7558
              lon: 37.6176
      responses:
        '204':
          description: Координаты сохранены.
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'

  Me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Профиль и настройки пользователя
      description: |
        Возвращает профиль текущего пользователя: имя, аватар, счётчики для
        хедера (растения, задачи на сегодня, непрочитанные уведомления) и
        настройки (тихие часы, таймзона, язык).

        `tasksToday` считается в **таймзоне пользователя** (`users.timezone`) —
        число **невыполненных** (pending) задач ухода, дедлайн которых наступает
        до конца сегодняшнего дня. Уже отмеченные сегодня задачи не учитываются.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя.
          content:
            application/json:
              schema:
                $ref: '#/schemas/MeResponse'
    delete:
      tags: [Me]
      operationId: deleteMe
      summary: Удаление аккаунта (GDPR / App Store)
      description: |
        Необратимо удаляет аккаунт текущего пользователя и все связанные данные
        (растения, расписания, история ухода, локации, список покупок и т.д.) через
        FK `ON DELETE CASCADE` на уровне БД.

        **Поведение Telegram-связки**: поле `telegram_chat_id` удаляется вместе
        со строкой пользователя. При следующем `/start` в боте для того же
        chat\_id создаётся **новый** пользователь с нуля — история не восстанавливается.

        **Идемпотентность**: повторный вызов с токеном удалённого пользователя
        вернёт `204` (tolerant-delete), а не `500` или `404`.

        Операция необратима. Требует действующего Bearer-токена.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Аккаунт удалён. Тело ответа отсутствует.
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Частичное обновление настроек пользователя
      description: |
        PATCH-семантика: обновляются только переданные поля, остальные остаются
        без изменений. Имя и аватар через этот эндпоинт не меняются.

        Смена `timezone` пересчитывает активные расписания так, чтобы локальное
        время дня сохранилось (полить в 9:00 остаётся 9:00 в новой зоне).
        Невалидный IANA-идентификатор → `400`. Совпадение тихих часов
        (`quietHoursStart == quietHoursEnd`, в т.ч. с учётом текущего значения,
        если передано только одно поле) → `400`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/MeUpdateRequest'
            example:
              quietHoursStart: '23:00'
              quietHoursEnd: '07:30'
              timezone: Europe/Belgrade
              locale: en
      responses:
        '200':
          description: Профиль обновлён.
          content:
            application/json:
              schema:
                $ref: '#/schemas/MeResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'

  Seasonal:
    get:
      tags: [Me]
      operationId: getSeasonalSettings
      summary: Per-season настройки сезонности
      description: |
        Возвращает тонкие per-season настройки сезонности текущего пользователя:
        множитель (`multiplier`) и фиксированный интервал (`intervalDays`) для
        каждого сезона (`SUMMER`, `WINTER`), а также глобальный флаг `enabled`
        и `mode`.

        Какое поле реально применяется к расчёту — зависит от `mode`:
        в режиме `MULTIPLIER` используется `multiplier`, в режиме `FIXED` —
        `intervalDays` (а если он `null`, fallback на базовый интервал растения).

        Глобальный флаг включения (`seasonalEnabled`) и режим (`seasonalMode`)
        меняются через `PATCH /api/v1/me`; здесь они отдаются только для контекста.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-season настройки сезонности.
          content:
            application/json:
              schema:
                $ref: '#/schemas/SeasonalSettingsResponse'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'
    patch:
      tags: [Me]
      operationId: updateSeasonalSettings
      summary: Задать множитель/интервал для сезона
      description: |
        Устанавливает множитель и/или фиксированный интервал для одного сезона.
        `season` обязателен. Переданные поля (`multiplier`, `intervalDays`)
        применяются, отсутствующие (`null`) остаются без изменений.

        - `multiplier` — коэффициент к базовому интервалу (диапазон `0.50..1.50`,
          округляется до сотых). Используется в режиме `MULTIPLIER`.
        - `intervalDays` — фиксированный интервал в днях (`1..60`). Используется
          в режиме `FIXED`. Чтобы вернуть сезон к дефолту (использовать базовый
          интервал растения), используйте `DELETE /api/v1/me/seasonal/{season}`.

        Изменение влияет на ленивый пересчёт `next_due_at` так же, как в боте.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/SeasonalSettingsUpdateRequest'
            example:
              season: SUMMER
              multiplier: 0.7
      responses:
        '200':
          description: Настройки сезона обновлены.
          content:
            application/json:
              schema:
                $ref: '#/schemas/SeasonalSettingsResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

  SeasonalItem:
    delete:
      tags: [Me]
      operationId: clearSeasonalInterval
      summary: Очистить фиксированный интервал сезона
      description: |
        Сбрасывает фиксированный интервал (`intervalDays`) указанного сезона в
        `null` — сезон возвращается к дефолтному поведению (в режиме `FIXED`
        используется базовый интервал растения). Множитель сезона не затрагивается.

        Идемпотентно: повторный вызов для уже очищенного сезона тоже вернёт `200`.
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: path
          required: true
          description: Сезон, чей фиксированный интервал нужно очистить.
          schema:
            $ref: '#/schemas/Season'
      responses:
        '200':
          description: Интервал сезона очищен; возвращены актуальные настройки.
          content:
            application/json:
              schema:
                $ref: '#/schemas/SeasonalSettingsResponse'
        '400':
          $ref: '../_common/responses.yaml#/BadRequest'
        '401':
          $ref: '../_common/responses.yaml#/Unauthorized'

schemas:
  WeatherLocationRequest:
    type: object
    description: |
      Тело `PUT /api/v1/me/weather-location`. Оба поля обязательны.
    required: [lat, lon]
    properties:
      lat:
        type: number
        format: double
        minimum: -90
        maximum: 90
        description: Широта в градусах (WGS-84).
        example: 55.7558
      lon:
        type: number
        format: double
        minimum: -180
        maximum: 180
        description: Долгота в градусах (WGS-84).
        example: 37.6176

  MeResponse:
    type: object
    description: Профиль и настройки текущего пользователя (`GET /api/v1/me`).
    required:
      - id
      - emailVerified
      - createdAt
      - name
      - plantsTotal
      - tasksToday
      - totalCareEvents
      - notificationsUnread
      - quietHoursStart
      - quietHoursEnd
      - timezone
      - locale
      - seasonalEnabled
      - seasonalMode
      - weatherEnabled
      - featureFlags
      - appleLinked
      - googleLinked
      - emailLinked
      - telegramLinked
      - isGuest
    properties:
      id:
        type: integer
        format: int64
        description: Идентификатор пользователя.
        example: 42
      email:
        type: string
        nullable: true
        description: Email пользователя. `null` для чисто Telegram-юзеров.
        example: user@example.com
      emailVerified:
        type: boolean
        description: Подтверждён ли email (magic link / verified OAuth-провайдером).
        example: false
      createdAt:
        type: string
        format: date-time
        description: Момент регистрации пользователя (UTC).
        example: '2026-01-15T08:30:00Z'
      name:
        type: string
        nullable: true
        description: Отображаемое имя пользователя (из `users.username`). Может быть `null`.
        example: Антон
      avatar:
        type: string
        nullable: true
        description: |
          URL аватара пользователя. Плейсхолдер: на текущей схеме нет колонки
          под аватар, поэтому поле всегда `null` до появления хранилища аватаров.
      plantsTotal:
        type: integer
        format: int32
        minimum: 0
        description: Число неархивированных растений пользователя.
        example: 12
      tasksToday:
        type: integer
        format: int32
        minimum: 0
        description: |
          Число невыполненных (pending) задач ухода на сегодня в таймзоне
          пользователя: дедлайн до конца сегодняшнего дня, отметка «сделано»
          ещё не проставлена. Это pending-подмножество `GET /api/v1/today`.
        example: 3
      totalCareEvents:
        type: integer
        format: int64
        minimum: 0
        description: |
          Суммарное число уходов за всё время пользователя (включая архивированные
          растения). Компенсирующие (отменённые) записи не учитываются.
        example: 348
      notificationsUnread:
        type: integer
        format: int32
        minimum: 0
        description: |
          Плейсхолдер: фид уведомлений (issue #183) ещё не влит, поэтому поле
          всегда `0`. Будет считаться по-настоящему после появления фида.
        example: 0
      quietHoursStart:
        type: string
        pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        description: Начало тихих часов, локальное время `HH:mm`.
        example: '22:00'
      quietHoursEnd:
        type: string
        pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        description: Конец тихих часов, локальное время `HH:mm`.
        example: '08:00'
      timezone:
        type: string
        description: IANA-идентификатор таймзоны пользователя.
        example: Europe/Moscow
      locale:
        type: string
        enum: [ru, en]
        description: Язык интерфейса/уведомлений.
        example: ru
      seasonalEnabled:
        type: boolean
        description: Учитывать сезоны при расчёте следующего полива.
        example: false
      seasonalMode:
        type: string
        enum: [MULTIPLIER, FIXED]
        description: |
          Режим сезонности: `MULTIPLIER` (коэффициент к базовому интервалу) или
          `FIXED` (фиксированные интервалы на сезон).
        example: MULTIPLIER
      weatherEnabled:
        type: boolean
        description: Учитывать погоду в рекомендациях.
        example: false
      featureFlags:
        type: object
        additionalProperties: true
        description: 'Per-user feature flags, например `{ "sharing": "true" }`.'
        example:
          sharing: 'true'
      appleLinked:
        type: boolean
        description: Привязан ли Sign in with Apple.
        example: false
      googleLinked:
        type: boolean
        description: Привязан ли Google.
        example: false
      emailLinked:
        type: boolean
        description: Задан ли email для входа.
        example: true
      telegramLinked:
        type: boolean
        description: Привязан ли Telegram-аккаунт.
        example: true
      isGuest:
        type: boolean
        description: |
          `true` для гостевых аккаунтов (зарегистрированных через `POST /auth/guest`).
          Мобилка использует это поле для показа баннера «Сохраните данные» (issue #227).
        example: false
      calendarSubscriptionUrl:
        type: string
        nullable: true
        description: |
          Готовый URL подписки на .ics-календарь вида `https://.../calendar/{token}.ics`.
          `null`, если токен ещё не создан — он генерируется лениво при первом запросе
          к эндпоинту `GET /calendar/{token}.ics` (issue #79, #208).
        example: 'https://plants-care.up.railway.app/calendar/abc123.ics'

  MeUpdateRequest:
    type: object
    description: |
      Частичное обновление настроек. Все поля опциональны — отсутствующие
      остаются без изменений.
    properties:
      quietHoursStart:
        type: string
        pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        nullable: true
        description: Начало тихих часов, локальное время `HH:mm`.
        example: '23:00'
      quietHoursEnd:
        type: string
        pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        nullable: true
        description: Конец тихих часов, локальное время `HH:mm`.
        example: '07:30'
      timezone:
        type: string
        nullable: true
        description: IANA-идентификатор таймзоны. Невалидный → `400`.
        example: Europe/Belgrade
      locale:
        type: string
        pattern: '^(ru|en)$'
        nullable: true
        description: Язык интерфейса/уведомлений. Допустимые значения — `ru` или `en`.
        example: en
      seasonalEnabled:
        type: boolean
        nullable: true
        description: Учитывать сезоны при расчёте следующего полива.
        example: true
      seasonalMode:
        type: string
        pattern: '^(MULTIPLIER|FIXED)$'
        nullable: true
        description: Режим сезонности. Допустимые значения — `MULTIPLIER` или `FIXED`.
        example: MULTIPLIER
      weatherEnabled:
        type: boolean
        nullable: true
        description: Учитывать погоду в рекомендациях.
        example: true

  Season:
    type: string
    enum: [SUMMER, WINTER]
    description: |
      Сезон. Первая итерация сезонности оперирует только летом и зимой
      (всё, что не лето — зима); границы настраиваются отдельно.

  SeasonSettings:
    type: object
    description: Настройки одного сезона (множитель и фиксированный интервал).
    required:
      - season
      - multiplier
    properties:
      season:
        $ref: '#/schemas/Season'
      multiplier:
        type: number
        format: double
        minimum: 0.5
        maximum: 1.5
        description: |
          Коэффициент к базовому интервалу растения. Применяется в режиме
          `MULTIPLIER`. Например, базовый 10 дней × 0.8 = полив каждые 8 дней.
        example: 0.8
      intervalDays:
        type: integer
        format: int32
        minimum: 1
        maximum: 60
        nullable: true
        description: |
          Фиксированный интервал в днях для этого сезона. Применяется в режиме
          `FIXED`. `null` — интервал не задан, используется базовый интервал
          растения.
        example: 5

  SeasonalSettingsResponse:
    type: object
    description: |
      Per-season настройки сезонности пользователя (`GET /api/v1/me/seasonal`).
      `enabled`/`mode` отдаются для контекста; меняются через `PATCH /api/v1/me`.
    required:
      - enabled
      - mode
      - seasons
    properties:
      enabled:
        type: boolean
        description: Глобальный флаг учёта сезонов (зеркало `seasonalEnabled`).
        example: true
      mode:
        type: string
        enum: [MULTIPLIER, FIXED]
        description: Активный режим сезонности (зеркало `seasonalMode`).
        example: MULTIPLIER
      seasons:
        type: array
        description: Настройки по каждому сезону (`SUMMER`, `WINTER`).
        items:
          $ref: '#/schemas/SeasonSettings'

  SeasonalSettingsUpdateRequest:
    type: object
    description: |
      Задать множитель и/или фиксированный интервал одного сезона. `season`
      обязателен; `multiplier`/`intervalDays` опциональны (отсутствующие не меняются).
    required:
      - season
    properties:
      season:
        $ref: '#/schemas/Season'
      multiplier:
        type: number
        format: double
        minimum: 0.5
        maximum: 1.5
        nullable: true
        description: Коэффициент к базовому интервалу (`0.50..1.50`).
        example: 0.7
      intervalDays:
        type: integer
        format: int32
        minimum: 1
        maximum: 60
        nullable: true
        description: |
          Фиксированный интервал в днях (`1..60`). Для сброса в дефолт используйте
          `DELETE /api/v1/me/seasonal/{season}`.
        example: 5

spring:
  application:
    name: plants-care
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # Локально читается DB_URL/DB_USERNAME/DB_PASSWORD.
    # На Railway автоматически проставляются PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD,
    # из них собираем JDBC URL.
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:plants_care}}
    username: ${DB_USERNAME:${PGUSER:plants_care}}
    password: ${DB_PASSWORD:${PGPASSWORD:plants_care}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # out-of-order=true: фича-ветки мерджатся в разном порядке, миграция
    # с меньшим номером (V15) может прийти после уже применённой большей (V16).
    # Без этого флага прод-Flyway откажется применять V15. Контент миграций
    # независим друг от друга — порядок применения внутри одного релиза не критичен.
    out-of-order: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  # Issue #88: SMTP для magic-link писем. Реальные креды только из env.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@plantcare.local}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  species:
    search-limit: 5

  # Issue #79: публичная подписка на .ics календарь.
  calendar:
    base-url: ${CALENDAR_BASE_URL:https://example.com}
    event-window-days: 90

  # Issue #138: health-score растения. Формула:
  #   score = round(onTimePct * on-time-weight) + (есть фото ? photo-bonus) + (есть заметки ? notes-bonus)
  # затем клампится в [0, 100]. Идеальная серия (100% on-time) + фото + заметки = 100.
  health-score:
    on-time-weight: 0.8    # доля 100-балльной шкалы под % on-time за 30 дней (макс. 80 баллов)
    photo-bonus: 10        # бонус за наличие фото (issue #24)
    notes-bonus: 10        # бонус за наличие заметок (issue #25)
    green-threshold: 80    # score >= → зелёная зона 🟢
    yellow-threshold: 50   # score >= (но < green) → жёлтая 🟡; ниже — красная 🔴

weather:
  cache-minutes: 60          # дефолт 60
  threshold-defer-ok: 80     # дефолт 80
  threshold-do-not-defer: 35 # дефолт 35
  open-meteo:
    base-url: https://api.open-meteo.com/v1
    timeout-seconds: 5

# Issue #88 (ADR-011): мобильная аутентификация. Секреты — только из env.
plantcare:
  auth:
    # Глобальный выключатель мобильной авторизации. На prod ВСЕГДА true.
    # AUTH_ENABLED=false — только для локальной разработки: /api/v1/** открываются
    # без токена, JWT-секрет не нужен, текущий пользователь = dev-user-id.
    enabled: ${AUTH_ENABLED:false}
    # users.id, от имени которого работают /api/v1/** при enabled=false.
    # Пользователь с этим id должен существовать в локальной БД.
    dev-user-id: ${AUTH_DEV_USER_ID:1}
    jwt:
      # HMAC-секрет для подписи наших access/refresh JWT. На prod ОБЯЗАТЕЛЬНО
      # задать длинный случайный AUTH_JWT_SECRET (>= 32 байт). Пустой дефолт.
      secret: ${AUTH_JWT_SECRET:}
      issuer: ${AUTH_JWT_ISSUER:https://plants-care.up.railway.app}
      access-ttl: ${AUTH_JWT_ACCESS_TTL:PT1H}
      refresh-ttl: ${AUTH_JWT_REFRESH_TTL:P30D}
    apple:
      bundle-id: ${AUTH_APPLE_BUNDLE_ID:}
      issuer: ${AUTH_APPLE_ISSUER:https://appleid.apple.com}
      jwks-uri: ${AUTH_APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}
    google:
      client-id: ${AUTH_GOOGLE_CLIENT_ID:}
      issuers: ${AUTH_GOOGLE_ISSUERS:accounts.google.com,https://accounts.google.com}
      jwks-uri: ${AUTH_GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
    magic-link:
      base-url: ${AUTH_MAGIC_LINK_BASE_URL:https://plants-care.up.railway.app/auth/verify}
      ttl: ${AUTH_MAGIC_LINK_TTL:PT15M}
      rate-limit:
        max-attempts: 5
        window-seconds: 300

    # Issue #92: Bucket4j per-IP/per-user rate limits for the REST API.
    # All values configurable via env vars on Railway.
    api:
      rate-limit:
        unauthenticated-per-minute: ${API_RL_UNAUTH_PER_MIN:100}
        authenticated-per-minute: ${API_RL_AUTH_PER_MIN:1000}
        auth-endpoint-per-minute: ${API_RL_AUTH_EP_PER_MIN:10}
        magic-link-per-minute: ${API_RL_MAGIC_LINK_PER_MIN:3}
        magic-link-per-hour: ${API_RL_MAGIC_LINK_PER_HOUR:5}
        max-buckets: ${API_RL_MAX_BUCKETS:100000}

  # Issue #215: Universal Links (iOS) / App Links (Android) для magic-link диплинков.
  # Значения зависят от мобильного приложения и различаются на dev/prod.
  # Требуются реальные данные от app-команды (Team ID, bundle id, SHA-256 fingerprints).
  deep-link:
    ios:
      # appID в формате <TeamID>.<BundleId>. Может быть несколько (dev/prod разные bundle id).
      # Пример: TEAMID1234.com.example.plantcare
      app-ids: ${DEEP_LINK_IOS_APP_IDS:PLACEHOLDER_TEAM_ID.com.example.plantcare}
      # Пути, которые AASA разрешает открывать в приложении.
      paths: ${DEEP_LINK_IOS_PATHS:/auth/verify*}
    android:
      # Package name Android-приложения. Пример: com.example.plantcare
      package-name: ${DEEP_LINK_ANDROID_PACKAGE_NAME:com.example.plantcare}
      # SHA-256 отпечатки подписи приложения (debug и release).
      # Формат: AA:BB:CC:... (hex через двоеточие). Может быть несколько.
      sha256-cert-fingerprints: ${DEEP_LINK_ANDROID_SHA256_CERT_FINGERPRINTS:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99}

admin:
  username: ${ADMIN_USERNAME:}
  password-bcrypt-hash: ${ADMIN_PASSWORD_BCRYPT_HASH:}
  session-timeout-hours: 8
  rate-limit:
    max-attempts: 5
    window-seconds: 60
  dashboard:
    timezone: Europe/Riga
    query-executor-pool-size: 8

server:
  # Railway передаёт PORT, локально используем SERVER_PORT/8080
  port: ${PORT:${SERVER_PORT:8080}}
  # Railway сидит за прокси, X-Forwarded-* нужны для rate-limit по реальному IP
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        # Issue #115: prometheus добавлен для Prometheus scrape.
        # На prod /actuator/prometheus требует роли ADMIN (см. AdminSecurityConfig),
        # health/info остаются публичными (UptimeRobot и т.п.).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Issue #88: starter-mail добавляет MailHealthIndicator, который пингует SMTP.
    # Отправка magic-link писем не должна влиять на liveness/health приложения.
    mail:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

# Параметры приложения (issue #28: healthcheck шедулера)
plants:
  scheduler:
    health:
      # Максимально допустимый возраст последнего тика, после которого health
      # компонент 'scheduler' начнёт возвращать DOWN. ISO-8601 duration.
      # Шедулер тикает раз в 60 секунд, дефолт 15 мин = 15 пропущенных тиков подряд.
      # Для более агрессивного мониторинга можно поставить PT3M (3 пропуска).
      max-tick-age: ${PLANTS_SCHEDULER_MAX_TICK_AGE:PT15M}

  # Issue #141: подсказка расходников перед предстоящей пересадкой.
  # «Предстоящая пересадка» = дата последней TRANSPLANT из журнала (#76) + interval-months.
  # Если она в окне ближайших horizon-days (в TZ юзера) — бот шлёт мягкую нотификацию
  # с кнопками «➕ В список покупок» / «Не нужно».
  transplant-suggestion:
    enabled: ${PLANTS_TRANSPLANT_SUGGESTION_ENABLED:true}
    horizon-days: ${PLANTS_TRANSPLANT_SUGGESTION_HORIZON_DAYS:14}
    interval-months: ${PLANTS_TRANSPLANT_SUGGESTION_INTERVAL_MONTHS:12}
    supplies:
      - Грунт
      - Дренаж
    message-template: "🪴 Растению «%s» скоро пересадка — добавить расходники (%s) в список покупок?"

# Telegram (placeholder, используется со следующей задачи)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    enabled: ${TELEGRAM_BOT_ENABLED:true}
  # Issue #29: очередь исходящих сообщений с rate-limiting под лимит Telegram (~30/sec).
  rate-limit:
    permits-per-second: ${TELEGRAM_RATE_LIMIT_PERMITS_PER_SECOND:25}
    queue-capacity: ${TELEGRAM_RATE_LIMIT_QUEUE_CAPACITY:10000}
    max-retries: ${TELEGRAM_RATE_LIMIT_MAX_RETRIES:3}
    default-retry-after-seconds: ${TELEGRAM_RATE_LIMIT_DEFAULT_RETRY_AFTER_SECONDS:1}
    max-retry-after-seconds: ${TELEGRAM_RATE_LIMIT_MAX_RETRY_AFTER_SECONDS:60}

logging:
  level:
    root: INFO
    com.plantcare.bot: DEBUG

# Issue #114: Sentry. По умолчанию выключен (no-op) — включается только на prod-профиле.
# На dev/test остаётся false, поэтому реальные отправки в Sentry из тестов невозможны.
sentry:
  enabled: false
  # Никогда не отправляем PII по умолчанию: chat_id/telegram_user_id хешируются
  # в SentryPiiFilter, тексты заметок/имена растений вырезаются.
  send-default-pii: false

kind: Application

spring:
  application:
    name: plants-care
  datasource:
    # Локально читается DB_URL/DB_USERNAME/DB_PASSWORD.
    # На Railway автоматически проставляются PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD,
    # из них собираем JDBC URL.
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:plants_care}}
    username: ${DB_USERNAME:${PGUSER:plants_care}}
    password: ${DB_PASSWORD:${PGPASSWORD:plants_care}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

app:
  species:
    search-limit: 5

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # Railway передаёт PORT, локально используем SERVER_PORT/8080
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Telegram (placeholder, используется со следующей задачи)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    enabled: ${TELEGRAM_BOT_ENABLED:false}

logging:
  level:
    root: INFO
    com.plantcare.bot: DEBUG

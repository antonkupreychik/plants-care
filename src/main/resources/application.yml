spring:
  application:
    name: plants-care

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/plants_care}
    username: ${DB_USERNAME:plants_care}
    password: ${DB_PASSWORD:plants_care}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Telegram (placeholder, используется со следующей задачи)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    enabled: ${TELEGRAM_BOT_ENABLED:false}

logging:
  level:
    root: INFO
    com.plantcare.bot: DEBUG

spring:
  application:
    name: plants-care
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # Локально читается DB_URL/DB_USERNAME/DB_PASSWORD.
    # На Railway автоматически проставляются PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD,
    # из них собираем JDBC URL.
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:plants_care}}
    username: ${DB_USERNAME:${PGUSER:plants_care}}
    password: ${DB_PASSWORD:${PGPASSWORD:plants_care}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

app:
  species:
    search-limit: 5

  # Issue #79: публичная подписка на .ics календарь.
  calendar:
    base-url: ${CALENDAR_BASE_URL:https://example.com}
    event-window-days: 90

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # out-of-order=true: фича-ветки мерджатся в разном порядке, миграция
    # с меньшим номером (V15) может прийти после уже применённой большей (V16).
    # Без этого флага прод-Flyway откажется применять V15. Контент миграций
    # независим друг от друга — порядок применения внутри одного релиза не критичен.
    out-of-order: true

weather:
  cache-minutes: 60          # дефолт 60
  threshold-defer-ok: 80     # дефолт 80
  threshold-do-not-defer: 35 # дефолт 35
  open-meteo:
    base-url: https://api.open-meteo.com/v1
    timeout-seconds: 5

admin:
  username: ${ADMIN_USERNAME:}
  password-bcrypt-hash: ${ADMIN_PASSWORD_BCRYPT_HASH:}
  session-timeout-hours: 8
  rate-limit:
    max-attempts: 5
    window-seconds: 60
  dashboard:
    timezone: Europe/Riga
    query-executor-pool-size: 8

server:
  # Railway передаёт PORT, локально используем SERVER_PORT/8080
  port: ${PORT:${SERVER_PORT:8080}}
  # Railway сидит за прокси, X-Forwarded-* нужны для rate-limit по реальному IP
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Параметры приложения (issue #28: healthcheck шедулера)
plants:
  scheduler:
    health:
      # Максимально допустимый возраст последнего тика, после которого health
      # компонент 'scheduler' начнёт возвращать DOWN. ISO-8601 duration.
      # Шедулер тикает раз в 60 секунд, дефолт 15 мин = 15 пропущенных тиков подряд.
      # Для более агрессивного мониторинга можно поставить PT3M (3 пропуска).
      max-tick-age: ${PLANTS_SCHEDULER_MAX_TICK_AGE:PT15M}

# Telegram (placeholder, используется со следующей задачи)
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    enabled: ${TELEGRAM_BOT_ENABLED:true}

logging:
  level:
    root: INFO
    com.plantcare.bot: DEBUG

spring:
  jpa:
    show-sql: false
  # Issue #278, эпик #277 фаза 0: на проде Redis-подключение через REDIS_URL
  # (Railway reference variable на внутренний адрес сервиса, redis://...:6379).
  # REQUIRED: если REDIS_URL не задан, старт упадёт fail-fast (Redis включён всегда).
  data:
    redis:
      url: ${REDIS_URL}

logging:
  level:
    root: INFO
    com.plantcare.bot: INFO

# Issue #114: на prod Sentry включён. DSN приходит из env SENTRY_DSN (пустой дефолт —
# если не задан, стартер инициализируется в no-op и просто не шлёт события).
# release берётся из Maven project.version через resource filtering (@...@-плейсхолдер,
# фильтрация application*.yml включена в spring-boot-starter-parent).
sentry:
  enabled: true
  dsn: ${SENTRY_DSN:}
  environment: prod
  release: @project.version@
  send-default-pii: false

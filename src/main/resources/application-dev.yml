spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Issue #114: на dev Sentry отключён — локально ошибки смотрим в логах,
# квоту free-tier не тратим.
sentry:
  enabled: false

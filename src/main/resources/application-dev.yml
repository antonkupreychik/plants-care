spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Issue #88: dummy-секрет для локального запуска. НЕ использовать на prod —
# там AUTH_JWT_SECRET задаётся через env. Длина >= 32 байт для HS256.
plantcare:
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:dev-only-insecure-jwt-secret-change-me-1234567890}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Issue #114: на dev Sentry отключён — локально ошибки смотрим в логах,
# квоту free-tier не тратим.
sentry:
  enabled: false

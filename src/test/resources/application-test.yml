spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    validate-on-migrate: false
    lock-retry-count: 100

# В тестах не регистрируем бота в Telegram API — токена нет, и registerBot
# уронит контекст. TelegramBotConfig.@ConditionalOnProperty(havingValue=true)
# отключит фабричный @Bean при enabled=false.
telegram:
  bot:
    enabled: false

# Issue #88: фиксированные значения auth для тестов (секрет — не настоящий,
# только для подписи/проверки HS256 в тестовом контексте).
plantcare:
  auth:
    jwt:
      secret: test-secret-please-change-this-is-32-bytes-minimum-for-hs256
      issuer: https://plants-care.test
      access-ttl: PT1H
      refresh-ttl: P30D
    apple:
      bundle-id: com.plantcare.test
      issuer: https://appleid.apple.com
      jwks-uri: https://appleid.apple.com/auth/keys
    google:
      client-id: test-google-client-id
      issuers: accounts.google.com,https://accounts.google.com
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
    magic-link:
      base-url: https://plants-care.test/auth/verify
      ttl: PT15M
      rate-limit:
        max-attempts: 5
        window-seconds: 300
  # Issue #215: тестовые значения для well-known эндпоинтов.
  deep-link:
    ios:
      app-ids: TESTTEAM123.com.plantcare.test
      paths: /auth/verify*
    android:
      package-name: com.plantcare.test
      sha256-cert-fingerprints: AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99

# Issue #239: фиксированные admin-credentials для тестового профиля.
# Хеш вычислен однократно (bcrypt cost 10, пароль "test-admin-password").
# Статическое значение гарантирует стабильный ключ кэша ApplicationContext:
# тесты, использующие только эти свойства, переиспользуют один контекст
# вместо создания нового контекста на каждый класс.
admin:
  username: admin
  password-bcrypt-hash: "$2y$10$upAKCz5ubY566NaebWzo0Ory65gtZad52dMeGc9u625aXmpcyFiWe"

logging:
  level:
    org.hibernate.SQL: WARN
    com.plantcare.bot: DEBUG
